{% extends "base.html" %}
{% import "_macros.html" as ui with context %}
{% block title %}Giriş · Nail Art CRM{% endblock %}
{% block body_class %}locked{% endblock %}
{% block content %}
  <form class="card login-card" method="post">
    <div class="brand">💅 Nail Art CRM</div>
    <p class="muted">Devam etmek için şifreni gir.</p>
    {{ ui.form_error(error) }}
    <label>Şifre<input type="password" name="password" required autocomplete="current-password" autofocus></label>
    <button class="btn primary">Giriş yap</button>
  </form>
{% endblock %}
