{% extends "base.html" %}
{% import "_macros.html" as ui with context %}
{% block title %}Şifre değiştir · Nail Art CRM{% endblock %}
{% block content %}
  <div class="page-head"><h1>Şifre değiştir</h1></div>
  <form class="card form-card" method="post">
    {{ ui.form_error(error) }}
    <label>Mevcut şifre<input type="password" name="current" required autocomplete="current-password" autofocus></label>
    <label>Yeni şifre<input type="password" name="new" required minlength="8" autocomplete="new-password"></label>
    <label>Yeni şifre (tekrar)<input type="password" name="confirm" required autocomplete="new-password"></label>
    <p class="small muted">Şifre değişince diğer cihazlardaki oturumlar kapanır.</p>
    <div class="form-actions">
      <span class="spacer"></span>
      <a class="btn ghost" href="{{ url_for('dashboard.index') }}">Vazgeç</a>
      <button class="btn primary">Kaydet</button>
    </div>
  </form>
{% endblock %}
